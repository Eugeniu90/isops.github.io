<!DOCTYPE html>
<!--
  Source for og-image.png (1200×630 social share card).
  This file is the SOURCE; the shipped asset is the rendered PNG.

  Re-export after editing (requires Google Chrome):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --default-background-color=00000000 \
      --screenshot="$PWD/og-image.png" \
      --virtual-time-budget=2000 "file://$PWD/og-image.html"

  Keep dimensions at 1200×630 (the 1.91:1 ratio LinkedIn / X / Slack / iMessage expect).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-400: #818cf8;
        --brand-500: #6366f1;
        --brand-600: #4f46e5;
        --brand-700: #4338ca;
        --surface:   #0a0e1a;
        --surface-100: #151d33;
        --surface-200: #1e293b;
        --gray-300:  #d1d5db;
        --gray-400:  #9ca3af;
        --green-400: #34d399;
        --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: var(--font-sans);
        background: var(--surface);
        color: #fff;
        position: relative;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* Indigo hero glow — echoes the live hero spotlight */
      .glow {
        position: absolute;
        width: 900px; height: 900px;
        top: -340px; right: -260px;
        background: radial-gradient(circle, rgba(99,102,241,.32) 0%, rgba(99,102,241,.10) 38%, transparent 68%);
        filter: blur(8px);
      }
      .glow-2 {
        position: absolute;
        width: 620px; height: 620px;
        bottom: -300px; left: -180px;
        background: radial-gradient(circle, rgba(67,56,202,.22) 0%, transparent 70%);
      }
      /* Faint engineering grid */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at 70% 30%, #000 0%, transparent 75%);
      }
      .wrap {
        position: relative;
        height: 100%;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand-icon {
        width: 56px; height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 30px rgba(99,102,241,.45);
      }
      .brand-name { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
      .pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 9px 18px;
        border: 1px solid rgba(129,140,248,.35);
        border-radius: 999px;
        background: rgba(99,102,241,.08);
        font-size: 18px; font-weight: 500; color: #c7d2fe;
        margin-bottom: 26px;
        width: fit-content;
      }
      .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--green-400);
        box-shadow: 0 0 12px var(--green-400);
      }
      h1 {
        font-size: 62px; font-weight: 800;
        line-height: 1.06; letter-spacing: -0.035em;
        max-width: 940px;
      }
      h1 .accent {
        background: linear-gradient(120deg, var(--brand-400), var(--brand-600));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub {
        margin-top: 26px;
        font-size: 23px; line-height: 1.38; font-weight: 400;
        color: var(--gray-300); max-width: 820px;
      }
      .sub b { color: #fff; font-weight: 600; }
      .foot { display: flex; align-items: center; gap: 14px; }
      .chip {
        font-family: var(--font-mono);
        font-size: 17px; font-weight: 500;
        padding: 9px 16px;
        border: 1px solid var(--surface-200);
        border-radius: 10px;
        background: var(--surface-100);
        color: var(--gray-300);
      }
      .chip .c { color: var(--green-400); }
      .url { margin-left: auto; font-size: 20px; color: var(--gray-400); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow-2"></div>
    <div class="grid"></div>
    <div class="wrap">
      <div class="brand">
        <span class="brand-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3.5 6.5V11.5C3.5 16.74 7.08 21.54 12 22.5C16.92 21.54 20.5 16.74 20.5 11.5V6.5L12 2Z" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 12.5L10.8 14.8L15.5 9.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">isops.ai</span>
      </div>

      <div>
        <span class="pill"><span class="dot"></span>AWS-native ISMS · ISO 27001 · ISO 42001 · SOC 2</span>
        <h1>We read your AWS account.<br /><span class="accent">Then we tell you what it is.</span></h1>
        <p class="sub">A relationship graph of your AWS estate, the ISMS artefacts an auditor asks for, and evidence that never shows <b>not assessed</b> as passed.</p>
      </div>

      <div class="foot">
        <span class="chip"><span class="c">✓</span> ISO 27001</span>
        <span class="chip"><span class="c">✓</span> ISO 42001</span>
        <span class="chip"><span class="c">✓</span> Read-only AWS</span>
        <span class="url">isops.ai</span>
      </div>
    </div>
  </body>
</html>
